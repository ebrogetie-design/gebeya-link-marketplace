services:
  - type: web
    name: gebeya-link-marketplace
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: marketplace-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: CURRENCY
        value: ETB
      - key: DATABASE_URL
        fromDatabase:
          name: gebeya-link-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads

databases:
  - name: gebeya-link-db
    plan: basic-256mb
    databaseName: gebeya_marketplace
    user: gebeya_app
